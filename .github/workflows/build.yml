# SPDX-License-Identifier: GPL-3.0-or-later
# Builds every firmware variant (variants/*.sdkconfig) and checks the Python tools.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  variants:
    name: List variants
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          list=$(python3 -c "import json,pathlib; print(json.dumps(sorted(p.stem for p in pathlib.Path('variants').glob('*.sdkconfig'))))")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Variants: $list"

  firmware:
    name: Firmware ${{ matrix.variant }}
    needs: variants
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1.1
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.variants.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe -> app version

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh" > /dev/null
          python tools/build.py "${{ matrix.variant }}" -- build merge-bin

      - name: Size summary
        shell: bash
        run: |
          d="build/${{ matrix.variant }}"
          app=$(stat -c%s "$d/elekstubehax2.bin")
          boot=$(stat -c%s "$d/bootloader/bootloader.bin")
          {
            echo "### ${{ matrix.variant }}"
            echo "| Image | Bytes |"
            echo "|---|---|"
            echo "| app | $app |"
            echo "| bootloader | $boot |"
            echo
            echo '```'
            head -1 "$d/flash_args"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.variant }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/${{ matrix.variant }}/merged-binary.bin
            build/${{ matrix.variant }}/elekstubehax2.bin
            build/${{ matrix.variant }}/bootloader/bootloader.bin
            build/${{ matrix.variant }}/partition_table/partition-table.bin
            build/${{ matrix.variant }}/ota_data_initial.bin
            build/${{ matrix.variant }}/flash_args

  python-tools:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Compile check
        run: python -m compileall -q tools
      - name: Render nixie faces (135x240, 80x160)
        run: |
          python tools/facegen/nixie.py -o out/faces/nixie-135x240 --montage
          python tools/facegen/nixie.py -o out/faces/nixie-80x160 --size 80x160 --montage
      - uses: actions/upload-artifact@v4
        with:
          name: faces
          retention-days: 14
          path: out/faces
